version: '3.9'

services:

  # PostgreSQL Datenbank-Container
  db:
    image: postgres:16-alpine
    container_name: coinfinder-db
    environment:
      POSTGRES_DB:       coinfinder
      POSTGRES_USER:     coinfinder
      POSTGRES_PASSWORD: coinfinder123
    volumes:
      - coinfinder-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinfinder -d coinfinder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Seed-Container: läuft einmal beim ersten Start und befüllt die DB mit Beispieldaten
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinfinder-seed
    command: node seed.js
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     coinfinder
      DB_USER:     coinfinder
      DB_PASSWORD: coinfinder123
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Express.js Backend + Angular Frontend (statisch serviert)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinfinder-backend
    ports:
      - "3001:3001"
    environment:
      PORT:        3001
      NODE_ENV:    production
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     coinfinder
      DB_USER:     coinfinder
      DB_PASSWORD: coinfinder123
      JWT_SECRET:  coinfinder-geheim-2024
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  coinfinder-db:
    driver: local
