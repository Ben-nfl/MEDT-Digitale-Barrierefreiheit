# diese datei beschreibt die anfragen und antworten für die testoberfläche unter /api-docs.
openapi: 3.0.3
info:
  title: CoinFinder API
  description: |
    Die REST-API für CoinFinder – meine Krypto-Watchlist mit Echtzeit-Kursen.

    ## Authentifizierung
    Die meisten Endpunkte brauchen einen JWT-Token. Den bekommst du über `/api/auth/login`.
    Danach den Token oben rechts bei **Authorize** als `Bearer <dein-token>` eintragen.

    **Demo-Zugänge:**
    - `admin` / `admin123`
    - `user` / `user123`
  version: 1.0.0

# die beschriebenen adressen beginnen auf demselben server mit /api.
servers:
  - url: /api
    description: Lokaler Server

tags:
  - name: Auth
    description: Login und eigene Benutzerdaten
  - name: Watchlist
    description: Coins beobachten
  - name: Alarme
    description: Preis-Benachrichtigungen
  - name: Preise
    description: Kursdaten von CoinGecko

# hier stehen wiederverwendbare beschreibungen für den anmeldungsnachweis und die datenfelder.
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # diese muster beschreiben den aufbau von coins, alarmen und fehlermeldungen.
  schemas:
    WatchlistCoin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        symbol:
          type: string
          example: bitcoin
        name:
          type: string
          example: Bitcoin
        type:
          type: string
          example: crypto
        erstellt_am:
          type: string
          format: date-time

    Alarm:
      type: object
      properties:
        id:
          type: integer
          example: 3
        symbol:
          type: string
          example: bitcoin
        zielpreis:
          type: number
          example: 100000
        richtung:
          type: string
          enum: [above, below]
          example: above
        status:
          type: string
          enum: [active, triggered]
          example: active
        erstellt_am:
          type: string
          format: date-time
        ausgeloest_am:
          type: string
          format: date-time
          nullable: true

    Fehler:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Fehlermeldung

paths:

  # diese beiden anfragen beschreiben anmeldung und abfrage der eigenen benutzerdaten.

  /auth/login:
    post:
      tags: [Auth]
      summary: Einloggen
      description: Gibt einen JWT-Token zurück der für alle anderen Anfragen gebraucht wird.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:        { type: integer, example: 1 }
                      username:  { type: string,  example: admin }
                      role:      { type: string,  example: admin }
                      name:      { type: string,  example: Administrator }
        '401':
          description: Falsche Zugangsdaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  /auth/me:
    get:
      tags: [Auth]
      summary: Eigene Benutzerdaten
      description: Gibt die Daten des aktuell eingeloggten Benutzers zurück.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Benutzerdaten
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:       { type: integer }
                      username: { type: string }
                      role:     { type: string }
                      name:     { type: string }
        '401':
          description: Token fehlt oder ungültig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  # hier werden laden, hinzufügen und entfernen von watchlist-coins beschrieben.

  /watchlist:
    get:
      tags: [Watchlist]
      summary: Alle Coins der Watchlist
      description: Gibt alle Coins zurück die aktuell beobachtet werden.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Liste der Coins
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchlistCoin'

    post:
      tags: [Watchlist]
      summary: Coin hinzufügen
      description: Fügt einen neuen Coin zur Watchlist hinzu. Das Symbol muss ein gültiger CoinGecko-ID sein (z.B. `bitcoin`, `ethereum`).
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, name]
              properties:
                symbol:
                  type: string
                  example: solana
                  description: CoinGecko-ID (Kleinbuchstaben)
                name:
                  type: string
                  example: Solana
                type:
                  type: string
                  example: crypto
                  default: crypto
      responses:
        '201':
          description: Coin wurde hinzugefügt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:    { $ref: '#/components/schemas/WatchlistCoin' }
        '400':
          description: Fehlende Pflichtfelder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
        '409':
          description: Coin ist schon in der Watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  /watchlist/{symbol}:
    delete:
      tags: [Watchlist]
      summary: Coin entfernen
      description: Entfernt einen Coin aus der Watchlist anhand seines Symbols.
      security:
        - BearerToken: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
          example: solana
          description: CoinGecko-ID des Coins
      responses:
        '200':
          description: Coin entfernt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '404':
          description: Coin nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  # diese anfragen verwalten preisgrenzen und den zustand der alarme.

  /alerts:
    get:
      tags: [Alarme]
      summary: Alle Alarme
      description: Gibt alle angelegten Preis-Alarme zurück (aktive und ausgelöste).
      security:
        - BearerToken: []
      responses:
        '200':
          description: Liste der Alarme
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alarm'

    post:
      tags: [Alarme]
      summary: Alarm erstellen
      description: |
        Erstellt einen neuen Preis-Alarm.

        - `direction: above` → Alarm feuert wenn Preis **über** `target_price` steigt
        - `direction: below` → Alarm feuert wenn Preis **unter** `target_price` fällt
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, target_price, direction]
              properties:
                symbol:
                  type: string
                  example: bitcoin
                target_price:
                  type: number
                  example: 100000
                direction:
                  type: string
                  enum: [above, below]
                  example: above
      responses:
        '201':
          description: Alarm erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:    { $ref: '#/components/schemas/Alarm' }
        '400':
          description: Ungültige Eingabe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  /alerts/{id}:
    delete:
      tags: [Alarme]
      summary: Alarm löschen
      security:
        - BearerToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Alarm gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '404':
          description: Alarm nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'

  /alerts/{id}/reset:
    patch:
      tags: [Alarme]
      summary: Alarm zurücksetzen
      description: Setzt einen ausgelösten Alarm zurück auf "active" damit er wieder überwacht wird.
      security:
        - BearerToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Alarm ist wieder aktiv
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:    { $ref: '#/components/schemas/Alarm' }

  # hier stehen preisabfrage, preisverlauf, coinsuche und die festen beispielpreise.

  /prices/current:
    get:
      tags: [Preise]
      summary: Aktuelle Preise aller Watchlist-Coins
      description: Holt Live-Kurse von CoinGecko für alle Coins in der Watchlist.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Aktuelle Preise
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    example:
                      bitcoin:
                        usd: 67420
                        usd_24h_change: 2.34
                        usd_market_cap: 1320000000000

  /prices/history/{symbol}:
    get:
      tags: [Preise]
      summary: Kursverlauf eines Coins
      description: Gibt die Preishistorie für die letzten N Tage zurück. Datenpunkte sind auf jeden 6. reduziert damit der Chart nicht überladen ist.
      security:
        - BearerToken: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
          example: bitcoin
        - in: query
          name: days
          schema:
            type: integer
            default: 7
          example: 30
          description: Anzahl der Tage (7, 14 oder 30 empfohlen)
      responses:
        '200':
          description: Preishistorie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: integer, example: 1710000000000 }
                        price:     { type: number,  example: 65000.42 }

  /prices/search:
    get:
      tags: [Preise]
      summary: Coin suchen
      description: Sucht nach Coins bei CoinGecko. Nützlich zum Finden der richtigen CoinGecko-ID.
      security:
        - BearerToken: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          example: bitcoin
          description: Suchbegriff (Name oder Ticker-Symbol)
      responses:
        '200':
          description: Suchergebnisse
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:     { type: string, example: bitcoin }
                        name:   { type: string, example: Bitcoin }
                        symbol: { type: string, example: BTC }
                        thumb:  { type: string, example: "https://..." }

  /prices/demo:
    get:
      tags: [Preise]
      summary: Demo-Preise (kein Internet nötig)
      description: Gibt fest eincodierte Demo-Kursdaten zurück. Gut zum Testen wenn CoinGecko nicht erreichbar ist.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Demo-Kurse
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object

  # die kleine statusabfrage wird auch zur kontrolle des laufenden servers verwendet.
  /health:
    get:
      tags: [Auth]
      summary: Server-Status prüfen
      description: Einfacher Health-Check, damit Docker weiß ob der Server noch läuft.
      responses:
        '200':
          description: Server ist online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:      { type: string, example: ok }
                  zeitstempel: { type: string, format: date-time }
